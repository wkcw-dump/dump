name: Generate Xiaomi Firmware

on:
  workflow_dispatch:
    inputs:
      rom_urls:
        description: "ROM URLs, separated by comma or semicolon"
        required: true
        type: string

jobs:
  prepare:
    runs-on: ubuntu-latest
    outputs:
      matrix: ${{ steps.set.outputs.matrix }}
      tag: ${{ steps.set.outputs.tag }}
    steps:
      - id: set
        run: |
          urls=$(echo "${{ inputs.rom_urls }}" | jq -R -s -c 'split("[,;]+"; "g") | map(gsub("^\\s+|\\s+$"; "")) | map(select(length > 0))')
          echo "matrix=$urls" >> "$GITHUB_OUTPUT"

          FIRST_URL=$(echo "$urls" | jq -r '.[0]')
          FILENAME=$(basename "$FIRST_URL" .zip)
          CODENAME=$(echo "$FILENAME" | cut -d'_' -f1)
          DATE=$(date +%Y%m%d)
          echo "tag=fw-${CODENAME}-${DATE}" >> "$GITHUB_OUTPUT"

  build-firmware:
    needs: prepare
    runs-on: ubuntu-latest
    permissions:
      contents: write
    strategy:
      max-parallel: 1
      fail-fast: false
      matrix:
        rom_url: ${{ fromJson(needs.prepare.outputs.matrix) }}
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3

      - run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
          PDG_VERSION=$(curl -s https://api.github.com/repos/ssut/payload-dumper-go/releases/latest | grep '"tag_name"' | cut -d '"' -f4)
          curl -L -o payload-dumper-go.tar.gz "https://github.com/ssut/payload-dumper-go/releases/download/${PDG_VERSION}/payload-dumper-go_${PDG_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf payload-dumper-go.tar.gz
          sudo mv payload-dumper-go /usr/local/bin/

      - run: uv tool install xiaomi_flashable_firmware_creator

      - run: curl -L --retry 5 --retry-delay 5 -O "${{ matrix.rom_url }}"

      - id: name
        run: |
          FILENAME=$(basename "${{ matrix.rom_url }}" .zip)
          echo "filename=${FILENAME}.zip" >> "$GITHUB_OUTPUT"

      - run: |
          mkdir -p output
          xiaomi_flashable_firmware_creator -F "${{ steps.name.outputs.filename }}" -o output

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ needs.prepare.outputs.tag }}
          files: output/*.zip
          append_body: true
