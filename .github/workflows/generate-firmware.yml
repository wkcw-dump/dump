name: Generate Xiaomi Firmware

on:
  workflow_dispatch:
    inputs:
      rom_url:
        description: "Direct URL to the MIUI/HyperOS ROM zip"
        required: true
        type: string

jobs:
  build-firmware:
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/setup-python@v5
        with:
          python-version: "3.11"

      - uses: astral-sh/setup-uv@v3

      - run: |
          sudo apt-get update
          sudo apt-get install -y xz-utils
          PDG_VERSION=$(curl -s https://api.github.com/repos/ssut/payload-dumper-go/releases/latest | grep '"tag_name"' | cut -d '"' -f4)
          curl -L -o payload-dumper-go.tar.gz "https://github.com/ssut/payload-dumper-go/releases/download/${PDG_VERSION}/payload-dumper-go_${PDG_VERSION#v}_linux_amd64.tar.gz"
          tar -xzf payload-dumper-go.tar.gz
          sudo mv payload-dumper-go /usr/local/bin/

      - run: uv tool install xiaomi_flashable_firmware_creator

      - run: curl -L --retry 5 --retry-delay 5 -O "${{ inputs.rom_url }}"

      - id: tag
        run: |
          FILENAME=$(basename "${{ inputs.rom_url }}" .zip)
          CODENAME=$(echo "$FILENAME" | cut -d'_' -f1)
          REGION=$(echo "$FILENAME" | sed -E "s/^${CODENAME}_//; s/-ota.*//")
          DATE=$(date +%Y%m%d)
          echo "filename=${FILENAME}.zip" >> "$GITHUB_OUTPUT"
          echo "name=fw-${CODENAME}-${REGION}-${DATE}" >> "$GITHUB_OUTPUT"

      - run: |
          mkdir -p output
          xiaomi_flashable_firmware_creator -F "${{ steps.tag.outputs.filename }}" -o output

      - uses: softprops/action-gh-release@v2
        with:
          tag_name: ${{ steps.tag.outputs.name }}
          files: output/*.zip
